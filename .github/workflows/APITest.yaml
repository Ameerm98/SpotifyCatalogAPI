name: SpotifyCatalogAPI Testing

on:
  workflow_dispatch:

jobs:
  API_Tests:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 23
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '23'

      - name: Run Tests
        run: |

          mvn test -Dtest=**/services/JSONDataSourceServiceTest
          mvn test -Dtest=**/services/SpotifyAPIDataSourcesTest
